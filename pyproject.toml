[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiworkingunits"
version = "0.1.0"
description = "Composable AI Working Units built on LangGraph + LangSmith"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.10",
    "langsmith>=0.1.140",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pymupdf4llm>=0.0.17",
    "dirtyjson>=1.0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "langgraph-cli[inmem]>=0.1.55",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
